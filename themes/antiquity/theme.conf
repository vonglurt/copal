# Copal theme: antiquity -- Linux Antiquity's helios, the light half.
# Sourced by copal-theme (POSIX sh). Colours are bare hex, no '#'.
NAME="Antiquity (helios)"
VARIANT=light                 # what GTK, the editor and the prompt lean to
PARTNER=tokyo-night           # what 'copal-theme --toggle' switches to
TERMINAL=helios               # copal-terminal-theme palette
QS_THEME=helios               # quickshell's currentTheme (Antiquity's own name)
WALLPAPER=georges_riom_collage.png   # a bundled name, or an absolute path

# The shell chrome: bar, launcher, menu, notifications, borders. These are
# Antiquity's helios tokens from quickshell/Config.qml -- dark chrome around
# light paper is the theme's own contrast, kept.
BASE=181818; SHADOW=121212; HIGHLIGHT=333333
ACCENT=fccf8a; ACCENT_DARK=87704f
TEXT=121212; TEXT_LIGHT=d0daed; WHITE=ffffff
URGENT=ff723e; DANGER=fc5870; WARNING=fcd37b
BORDER_ACTIVE=fccf8a; BORDER_INACTIVE=1c1c1c

# Applications. adw-gtk3 is the light Adwaita clone stage 16 installs the
# dark twin of; libadwaita apps read COLOR_SCHEME through gsettings.
GTK_THEME=adw-gtk3; COLOR_SCHEME=default
MC_SKIN=sand256               # mc's own light skin; matches the paper
HELIX_THEME=onelight
# The prompt: ochre user@host, the rice's purple for the path. SGR codes;
# the terminal palette turns them into the theme's colours.
PROMPT_USER_SGR="1;33"; PROMPT_PATH_SGR="1;35"
