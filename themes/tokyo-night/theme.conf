# Copal theme: tokyo-night -- the universal dark one. Stage 4's palette
# (i3, i3status, .Xresources) and, on Hyprland, diinki's star chart for
# the wallpaper. Sourced by copal-theme (POSIX sh). Bare hex, no '#'.
NAME="Tokyo Night"
VARIANT=dark
PARTNER=antiquity
TERMINAL=night
QS_THEME=night                # copal-theme adds this scheme to Config.qml
WALLPAPER=oc_the_blackboard.png      # Antiquity's night sky, bundled

BASE=1a1b26; SHADOW=16161e; HIGHLIGHT=292e42
ACCENT=7aa2f7; ACCENT_DARK=565f89
TEXT=1a1b26; TEXT_LIGHT=c0caf5; WHITE=c0caf5
URGENT=f7768e; DANGER=f7768e; WARNING=e0af68
BORDER_ACTIVE=7aa2f7; BORDER_INACTIVE=1a1b26

GTK_THEME=adw-gtk3-dark; COLOR_SCHEME=prefer-dark
MC_SKIN=modarin256-defbg      # dark, on the terminal's own ground
HELIX_THEME=tokyonight
PROMPT_USER_SGR="1;32"; PROMPT_PATH_SGR="1;34"
